name: komporcare
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.1.2
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Package untuk ganti logo aplikasi & splash screen
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.0

# ===== Konfigurasi Logo Aplikasi (Launcher Icon) =====
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#2F7D5B"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

# ===== Konfigurasi Logo Loading Awal (Native Splash) =====
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/icon/splash_logo.png
  android: true
  ios: true
  android_12:
    image: assets/icon/splash_logo.png
    color: "#FFFFFF"

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/images/